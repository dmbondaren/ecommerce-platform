name: ecommerce-platform

services:
  db:
    image: postgres:17-alpine
    container_name: marketplace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - marketplace_net

  server:
    container_name: marketplace-api
    build:
      context: ./server
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://marketplace:marketplace@db:5432/marketplace?schema=public
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      # Development default only. Production must provide its own secret.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-change-me-dev-only-secret}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - marketplace_net

  client:
    container_name: marketplace-web
    build:
      context: ./client
      target: dev
    restart: unless-stopped
    environment:
      # The dev server proxies /api, /uploads and /ws to the API container.
      VITE_PROXY_TARGET: http://server:5000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    networks:
      - marketplace_net

volumes:
  db_data:
  server_node_modules:
  client_node_modules:

networks:
  marketplace_net:
    driver: bridge
