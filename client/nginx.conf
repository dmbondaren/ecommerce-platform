server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Ten photos of 10 MB each, plus multipart overhead.
  client_max_body_size 105m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

  # The browser talks to one origin; nginx forwards API traffic to the backend.
  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Vite puts a content hash into these file names, so they never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: every other path serves the application shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
